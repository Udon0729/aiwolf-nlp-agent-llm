[project]
name = "aiwolf-nlp-agent-llm"
version = "0.3.6"
dependencies = [
    "aiwolf-nlp-common==0.7.0",
    "python-ulid>=3.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.6",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=0.3.9",
    "langchain-ollama>=0.3.0",
    "python-dotenv>=1.1.0",
]
requires-python = ">=3.11"
authors = [
    { name = "aiwolfdial", email = "aiwolf@kanolab.net" },
    { name = "nwatanabe", email = "nwatanabe@kanolab.net" },
    { name = "ysahashi", email = "ysahashi@kanolab.net" },
]
maintainers = [
    { name = "aiwolfdial", email = "aiwolf@kanolab.net" },
    { name = "nwatanabe", email = "nwatanabe@kanolab.net" },
    { name = "ysahashi", email = "ysahashi@kanolab.net" },
]
description = "aiwolf-nlp-agent-llm"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["aiwolf"]

[project.urls]
Homepage = "https://aiwolfdial.github.io/aiwolf-nlp/"

[dependency-groups]
dev = ["pyright>=1.1.402", "ruff>=0.12.1"]
lint = ["ruff>=0.12.1"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
reportMissingImports = "error"
reportMissingTypeStubs = false
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
# COM812(末尾カンマ)はフォーマッタと衝突するため除外する(ruff自身の警告に従う)
ignore = ["COM812"]
unfixable = ["F401", "F841"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
# eval は分析用のCLIツール。標準出力への印字を許可する。判定プロンプトの日本語文中の
# 全角括弧・全角記号を RUF001 が誤検知するため抑制する
"eval/**" = ["T201", "INP001", "RUF001"]
# texts_*.py はテキスト定数ファイル。日本語コメント・日本語文中の全角記号を
# ERA001/RUF001 が誤検知するため抑制する
"src/growth/texts_ja.py" = ["ERA001", "RUF001"]
"src/growth/texts_en.py" = ["ERA001"]
